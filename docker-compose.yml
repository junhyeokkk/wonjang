services:
  db:
    image: postgres:16-alpine
    container_name: wonjang-db
    environment:
      POSTGRES_DB: wonjang
      POSTGRES_USER: wonjang
      POSTGRES_PASSWORD: wonjang_local
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U wonjang -d wonjang"]
      interval: 5s
      timeout: 3s
      retries: 5

volumes:
  pgdata: